# Dokploy / production compose (canonical name for GitHub → Dokploy templates).
# Same stack as docker-compose.prod.yml — prefer this filename in Dokploy.
#
# IMPORTANT: NEXT_PUBLIC_API_URL is compile-time. Changing it requires image rebuild.
#
# No host `ports:` mapping — Dokploy/Traefik reaches container port 3000 on the
# compose network. Binding 0.0.0.0:3000 collides when another app already owns it.
name: convites-front

services:
  front:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    image: ${APP_IMAGE_NAME:-convites-front}:prod
    container_name: convites-front
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Runtime note: NEXT_PUBLIC_* in environment does NOT change the client bundle.
      API_URL: ${API_URL:-${NEXT_PUBLIC_API_URL}}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
