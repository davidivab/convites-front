# Local frontend. API runs separately on host :8095 (convites Docker).
name: convites-front

services:
  front:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: convites-front
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "${FRONT_PORT:-3095}:3000"
    env_file:
      - .env.local
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8095}
      # Server-side fetch from inside the container to host API
      API_URL: ${API_URL:-http://host.docker.internal:8095}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./:/app
      - convites_front_node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  convites_front_node_modules:
    name: convites_front_node_modules
